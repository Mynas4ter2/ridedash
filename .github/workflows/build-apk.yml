name: Build Android APK

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build RideDash Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK output
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RideDash-debug.apk

      - name: Upload RideDash APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RideDash-Android-APK
          path: RideDash-debug.apk
          retention-days: 30
